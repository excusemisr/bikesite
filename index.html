<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Scotland</title>
    <style>
        /* Modern Reset & Typography */
        @import url('https://googleapis.com');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top, #141923 0%, #080a0f 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Godly Typography */
        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #00ffcc 0%, #0077ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 10px 30px rgba(0, 255, 204, 0.2);
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            color: #8fa0b5;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
        }

        /* Epic Image Container */
        .image-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 
                        0 0 50px rgba(0, 255, 204, 0.15);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 50px;
            max-width: 100%;
        }

        .image-container:hover {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.8), 
                        0 0 60px rgba(0, 119, 255, 0.3);
        }

        img {
            display: block;
            object-fit: cover;
            width: 600px;
            height: 350px;
            max-width: 100%;
            filter: brightness(0.9) contrast(1.1);
        }

        /* High-End Navigation Bar */
        nav {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            padding: 12px 28px;
            border-radius: 100px;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Glassmorphism Hover Effects */
        a:hover {
            color: #00ffcc;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Highlighting the active/primary link vibe */
        a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #00ffcc;
            transition: width 0.3s ease;
        }

        a:hover::after {
            width: 40%;
        }
    </style>
</head>
<body>

    <h1>Bike Scotland</h1>
    <p>Two wheels good, Four wheels bad.</p>
    
    <div class="image-container">
        <img src="Bike Scotland.jpg" alt="Bike Scotland">
    </div>

    <nav>
        <a href="Race.html">Racing Bikes</a>
        <a href="Road.html">Road Bikes</a>
        <a href="Mountain.html">Mountain Bikes</a>
    </nav>

</body>
</html>
